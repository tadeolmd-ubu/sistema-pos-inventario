name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Calcular versión
        id: version
        shell: pwsh
        run: echo "value=1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test PosInventario.sln -c Release

      - name: Publish
        run: >
          dotnet publish PosInventario/PosInventario.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.value }}
          -p:AssemblyVersion=${{ steps.version.outputs.value }}.0
          -p:FileVersion=${{ steps.version.outputs.value }}.0
          -o publish

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          if (!(Test-Path "publish/PosInventario.exe")) {
            throw "No se generó publish/PosInventario.exe"
          }

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compilar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "No se encontró Inno Setup en $iscc"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DSourceDir=${{ github.workspace }}\publish" `
            "installer\PosInventario.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup falló con código $LASTEXITCODE"
          }

      - name: Verificar instalador
        shell: pwsh
        run: |
          $instalador = "dist/PosInventario-${{ steps.version.outputs.value }}-win-x64-installer.exe"

          if (!(Test-Path $instalador)) {
            throw "No se generó $instalador"
          }

      - name: Probar instalación y desinstalación
        shell: pwsh
        run: |
          $instalador = (Resolve-Path "dist/PosInventario-${{ steps.version.outputs.value }}-win-x64-installer.exe").Path
          $programa = Join-Path $env:LOCALAPPDATA "Programs\Sistema de inventario"
          $datos = Join-Path $env:LOCALAPPDATA "SistemaInventario"
          $marca = Join-Path $datos "prueba-instalador.txt"

          New-Item -ItemType Directory -Force -Path $datos | Out-Null
          Set-Content -Path $marca -Value "los datos deben sobrevivir a la desinstalación"

          Start-Process -FilePath $instalador `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
            -Wait

          $exe = Join-Path $programa "PosInventario.exe"

          if (!(Test-Path $exe)) {
            throw "El instalador no copió PosInventario.exe"
          }

          $desinstalador = Get-ChildItem $programa -Filter "unins*.exe" |
            Select-Object -First 1

          if ($null -eq $desinstalador) {
            throw "El instalador no creó el desinstalador"
          }

          Start-Process -FilePath $desinstalador.FullName `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait

          if (Test-Path $exe) {
            throw "El desinstalador no eliminó PosInventario.exe"
          }

          if (!(Test-Path $marca)) {
            throw "El desinstalador borró datos de LocalApplicationData"
          }

          Remove-Item $marca -Force

      - name: Comprimir
        shell: pwsh
        run: >
          Compress-Archive
          -Path publish/*
          -DestinationPath PosInventario-${{ steps.version.outputs.value }}-win-x64.zip

      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: |
            PosInventario-${{ steps.version.outputs.value }}-win-x64.zip
            dist/PosInventario-${{ steps.version.outputs.value }}-win-x64-installer.exe
